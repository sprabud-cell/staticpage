<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Nginx</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h1 {
            color: #009639;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .info {
            margin-top: 20px;
            color: #666;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎉 Welcome to Nginx!</h1>
    <p>Your web server is running successfully.</p>

    <div class="info">
        <p><strong>Server:</strong> Nginx</p>
        <p><strong>Status:</strong> Running</p>
        <p><strong>Host:</strong> AWS EC2</p>
    </div>

    <div class="footer">
        <p>Powered by Nginx</p>
    </div>
</div>

</body>
</html>
